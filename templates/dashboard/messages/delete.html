{% extends 'dashboard/base.html' %}
{% block title %}Hapus Pesan{% endblock %}

{% block dashboard_content %}
<div class="page-header-dash">
    <h1><i class="fas fa-exclamation-triangle"></i> Konfirmasi Hapus</h1>
</div>

<div class="d-card">
    <div class="d-card-body">
        <div class="delete-confirm">
            <div class="delete-icon"><i class="fas fa-trash-alt"></i></div>
            <h2>Hapus Pesan?</h2>
            <p>Anda yakin ingin menghapus pesan dari:</p>
            <h3>{{ msg.name }} — "{{ msg.subject }}"</h3>
            <p class="text-muted">Tindakan ini tidak dapat dibatalkan.</p>
            <form method="POST" class="delete-actions">
                {% csrf_token %}
                <button type="submit" class="btn-dash btn-dash-danger" id="btn-confirm-delete-msg"><i class="fas fa-trash"></i> Ya, Hapus</button>
                <a href="{% url 'dashboard:message_list' %}" class="btn-dash btn-dash-secondary">Batal</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
