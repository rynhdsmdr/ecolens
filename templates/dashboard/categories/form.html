{% extends 'dashboard/base.html' %}
{% block title %}{{ title }}{% endblock %}

{% block dashboard_content %}
<div class="page-header-dash">
    <div>
        <h1><i class="fas fa-{% if category %}edit{% else %}plus{% endif %}"></i> {{ title }}</h1>
    </div>
    <a href="{% url 'dashboard:category_list' %}" class="btn-dash btn-dash-secondary">
        <i class="fas fa-arrow-left"></i> Kembali
    </a>
</div>

<div class="d-card">
    <div class="d-card-body">
        <form method="POST" class="d-form" id="category-form">
            {% csrf_token %}
            {% for field in form %}
            <div class="form-group">
                <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}<div class="form-error">{{ field.errors.0 }}</div>{% endif %}
            </div>
            {% endfor %}
            <div class="form-actions">
                <button type="submit" class="btn-dash btn-dash-primary" id="btn-submit-category">
                    <i class="fas fa-save"></i> {{ submit_text }}
                </button>
                <a href="{% url 'dashboard:category_list' %}" class="btn-dash btn-dash-secondary">Batal</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
